services:
  postgres:
    image: postgres:16
    container_name: markowitz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-markowitz}
      POSTGRES_USER: ${POSTGRES_USER:-markowitz_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-markowitz_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    container_name: markowitz_adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8081:8080"

  minio:
    image: minio/minio:latest
    container_name: markowitz_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  mlflow:
    image: python:3.11-slim
    container_name: markowitz_mlflow
    restart: unless-stopped
    working_dir: /mlflow
    command: >
      bash -c "pip install mlflow==2.21.0 &&
      mkdir -p /mlflow/artifacts &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow.db
      --artifacts-destination /mlflow/artifacts"
    ports:
      - "5005:5000"
    volumes:
      - mlflow_data:/mlflow

  fastapi:
    build:
      context: .
      dockerfile: docker/fastapi.Dockerfile
    container_name: markowitz_fastapi
    restart: unless-stopped
    depends_on:
      - postgres
      - mlflow
      - minio
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://markowitz_user:markowitz_pass@postgres:5432/markowitz}
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-http://mlflow:5000}
      MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-markowitz-streamlit}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    ports:
      - "8000:8000"
    volumes:
      - .:/apprepo

  streamlit:
    build:
      context: .
      dockerfile: docker/streamlit.Dockerfile
    container_name: markowitz_streamlit
    restart: unless-stopped
    depends_on:
      - fastapi
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://fastapi:8000}
      MLFLOW_UI_URL: ${MLFLOW_UI_URL:-http://localhost:5005}
      MINIO_CONSOLE_URL: ${MINIO_CONSOLE_URL:-http://localhost:9001}
      STREAMLIT_SERVER_HEADLESS: "true"
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://markowitz_user:markowitz_pass@postgres:5432/markowitz}
    ports:
      - "8502:8501"
    volumes:
      - .:/apprepo

volumes:
  postgres_data:
  mlflow_data:
  minio_data:
