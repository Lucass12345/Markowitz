name: Python CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: sqlite:////tmp/markowitz-ci.db
      MPLCONFIGDIR: /tmp/matplotlib
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt pytest==8.3.5 httpx==0.28.1 ruff==0.11.13
      - run: ruff check src api app tests --select E9,F63,F7,F82,F821
      - run: python -m compileall -q src api app scripts
      - run: python -m pytest -q
