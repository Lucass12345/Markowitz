name: Yahoo dataset and models
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Yahoo tickers separated by spaces; empty uses the repository universe'
        required: false
        default: ''
  schedule:
    - cron: '30 3 * * 2-6'
permissions:
  contents: read
concurrency:
  group: yahoo-models
  cancel-in-progress: false
jobs:
  refresh-and-train:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      MPLCONFIGDIR: /tmp/matplotlib
      TICKERS: ${{ inputs.tickers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Refresh and retrain
        shell: bash
        run: |
          args=()
          if [[ -n "$TICKERS" ]]; then
            read -r -a symbols <<< "$TICKERS"
            args=(--tickers "${symbols[@]}")
          fi
          python scripts/run_refresh_dataset.py "${args[@]}" --retrain --candidate-only --epochs 30
      - uses: actions/upload-artifact@v4
        with:
          name: yahoo-candidate-${{ github.run_id }}
          path: Data/releases/
          if-no-files-found: error
          retention-days: 30
