name: Yahoo dataset and models
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Yahoo tickers separated by spaces; empty uses the repository universe'
        required: false
        default: ''
  schedule:
    - cron: '30 3 * * 2-6'
permissions:
  contents: read
concurrency:
  group: yahoo-models
  cancel-in-progress: false
jobs:
  refresh-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MPLCONFIGDIR: /tmp/matplotlib
      TICKERS: ${{ inputs.tickers }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pandas==2.2.3 numpy==2.1.3 arch==7.2.0 yfinance==1.7.0 'requests>=2.32,<3'
      - name: Refresh and retrain
        shell: bash
        run: |
          args=()
          if [[ -n "$TICKERS" ]]; then
            read -r -a symbols <<< "$TICKERS"
            args=(--tickers "${symbols[@]}")
          fi
          python scripts/run_refresh_dataset.py "${args[@]}" --retrain --epochs 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yahoo-dataset-models-${{ github.run_id }}
          path: |
            Data/active_dataset.json
            Data/dynamic/
            outputs/lstm_lab/latest_run.json
            outputs/lstm_lab/runs/
            outputs/predictions/return_predictions_lstm.csv
            outputs/predictions/lstm_production.json
            outputs/predictions/volatility_predictions.csv
            outputs/predictions/garch_diagnostics.json
            models_artifacts/returns_lstm/runs/
          retention-days: 14
